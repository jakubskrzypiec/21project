<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Logowanie — 21project Admin</title><link rel="stylesheet" href="/admin/admin.css"></head><body class="login-page">
<div class="login-card"><div class="logo" style="color:#111;margin:0">21 <small>ADMIN</small></div><h1>Panel 21project</h1><p class="muted">Statystyki, leady i prospecting w jednym miejscu.</p><form id="login-form"><label>E-mail<input class="input" type="email" name="email" autocomplete="username" required></label><label>Hasło<input class="input" type="password" name="password" autocomplete="current-password" required></label><button class="btn dark" type="submit">Zaloguj się</button><div class="message" id="login-message"></div></form></div>
<script>document.getElementById('login-form').addEventListener('submit',async e=>{e.preventDefault();const m=document.getElementById('login-message');m.textContent='Logowanie…';const p=Object.fromEntries(new FormData(e.currentTarget));const r=await fetch('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(p)});const d=await r.json();if(r.ok)location.href='/admin';else m.textContent=d.error||'Błąd logowania.'});fetch('/api/admin/me').then(r=>{if(r.ok)location.href='/admin'}).catch(()=>{});</script></body></html>
