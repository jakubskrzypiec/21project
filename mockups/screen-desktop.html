<!doctype html>
<html lang="pl"><head><meta charset="utf-8">
<style>
@font-face{font-family:Inter;src:url('../inter-400.woff2') format('woff2');font-weight:400}
@font-face{font-family:Inter;src:url('../inter-500.woff2') format('woff2');font-weight:500}
@font-face{font-family:Inter;src:url('../inter-600.woff2') format('woff2');font-weight:600}
*{margin:0;padding:0;box-sizing:border-box}
body{width:1901px;height:1079px;background:#07080b;color:#f4f5f8;font-family:Inter,sans-serif;overflow:hidden;position:relative}
.glow{position:absolute;inset:0;background:
  radial-gradient(58% 46% at 78% 8%,rgba(255,255,255,.13),transparent 70%),
  radial-gradient(46% 40% at 12% 96%,rgba(255,255,255,.05),transparent 70%)}
.grid{position:absolute;inset:0;opacity:.5;
  background-image:linear-gradient(rgba(255,255,255,.028) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.028) 1px,transparent 1px);
  background-size:158px 158px}
.mark{position:absolute;left:-210px;bottom:-400px;width:860px;opacity:.55}
.mark img{width:100%;display:block;filter:brightness(0) invert(1);opacity:.035}
.bar{position:absolute;top:0;left:0;right:0;height:104px;padding:0 64px;display:flex;align-items:center;gap:56px;border-bottom:1px solid rgba(255,255,255,.09)}
.bar img.logo{height:34px;filter:brightness(0) invert(1)}
nav{margin-left:auto;display:flex;gap:44px;font-size:17px;font-weight:500;letter-spacing:.17em;color:#9d9da3}
.cta{border:1px solid rgba(255,255,255,.28);border-radius:999px;padding:14px 28px;font-size:16px;font-weight:600;letter-spacing:.13em;color:#fff}
main{position:absolute;inset:104px 0 128px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:46px;text-align:center}
.eyebrow{font-size:19px;letter-spacing:.42em;color:#7e7e84;font-weight:500}
.lock{width:840px;filter:brightness(0) invert(1)}
.rule{width:220px;height:1px;background:rgba(255,255,255,.24)}
.tag{font-size:27px;color:#cfd2d8;font-weight:400;letter-spacing:-.01em}
.foot{position:absolute;left:64px;right:64px;bottom:0;height:128px;display:flex;align-items:center;border-top:1px solid rgba(255,255,255,.09)}
.foot div{flex:1;display:flex;align-items:baseline;gap:16px;font-size:18px;letter-spacing:.2em;color:#9d9da3;font-weight:500}
.foot b{font-size:15px;color:#55565c;font-weight:500;letter-spacing:.1em}
</style></head><body>
<div class="glow"></div><div class="grid"></div>
<div class="mark"><img src="../logo-mark.svg" alt=""></div>
<header class="bar">
  <img class="logo" src="../logo.svg" alt="21 project">
  <nav><span>REALIZACJE</span><span>OFERTA</span><span>PROCES</span><span>KONTAKT</span></nav>
  <span class="cta">BEZPŁATNA WYCENA</span>
</header>
<main>
  <p class="eyebrow">STUDIO PROJEKTOWE</p>
  <img class="lock" src="../logo.svg" alt="21 project">
  <div class="rule"></div>
  <p class="tag">Strony internetowe dla firm · Katowice i Śląsk</p>
</main>
<footer class="foot">
  <div><b>01</b> PROJEKT</div><div><b>02</b> KOD</div><div><b>03</b> SEO</div>
</footer>
</body></html>
